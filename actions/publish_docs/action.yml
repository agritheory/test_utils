name: Publish Docs
description: Rebuild the AgriTheory website when a push to the default branch changes markdown. For AgriTheory apps only.
author: AgriTheory

inputs:
  before:
    description: Commit SHA of the branch tip before this push
    required: true
  sha:
    description: Commit SHA of this push
    required: true
  token:
    description: Token that can start agritheory/atsite workflows
    required: true

branding:
  icon: book-open
  color: green

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Docs changed in this release
      id: docs
      shell: bash
      env:
        BEFORE: ${{ inputs.before }}
        SHA: ${{ inputs.sha }}
      run: |
        if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if git diff --name-only "$BEFORE" "$SHA" -- ':(glob)**/*.md' | grep -q .; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Dispatch atsite generate
      if: steps.docs.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: gh workflow run ci.yml --repo agritheory/atsite --ref main
